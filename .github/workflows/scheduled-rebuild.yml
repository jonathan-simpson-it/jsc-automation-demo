name: Scheduled Blog Rebuild

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trigger-vercel-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret not set — create a deploy hook in Vercel (Settings → Deploy Hooks) and add it as a GitHub secret."
            exit 1
          fi
          curl -f -X POST "$HOOK_URL"
